# Registers this service as a Service Extension resource the gateway can call
# out to over Envoy ext_proc. Rendered by `make register`; the output is gitignored.
name: projects/${PROJECT_ID}/locations/${GC_REGION}/authzExtensions/${GC_SERVICE_EXTENSION_NAME}
service: ${EXTENSION_SERVICE_HOST}
# authority must also be EXTENSION_SERVICE_HOST: it is the Host header on the ext_proc callout.
# Without it the callout sends a wrong Host and fails closed (fast DENIED verdicts
# in gateway logs with zero [ExtSvc] request lines).
authority: ${EXTENSION_SERVICE_HOST}
# If the extension is unreachable, deny the request rather than let it through.
failOpen: false
timeout: 5s
# The extension speaks the ext_proc gRPC protocol (Cloud Run, port 50051, HTTP/2).
wireFormat: EXT_PROC_GRPC
loadBalancingScheme: LOAD_BALANCING_SCHEME_UNSPECIFIED
