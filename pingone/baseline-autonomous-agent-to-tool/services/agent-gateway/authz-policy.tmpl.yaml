# The gateway's interception policy: send every /mcp egress request to the
# extension service (for validation, PingOne Authorize, and token remint)
# before it is forwarded.
name: projects/${PROJECT_ID}/locations/${GC_REGION}/authzPolicies/${GC_AUTHZ_POLICY_NAME}
action: CUSTOM
# Body-aware: the extension receives request/response bodies, and must echo
# every chunk back or the backend gets an empty body.
policyProfile: CONTENT_AUTHZ
customProvider:
  authzExtension:
    resources:
      - projects/${PROJECT_ID}/locations/${GC_REGION}/authzExtensions/${GC_SERVICE_EXTENSION_NAME}
# A request calls out only when BOTH hold: its host is a registered Agent
# Registry destination (MCP server, agent, or HTTP endpoint — unregistered
# hosts are dropped before any policy runs), and its path starts with /mcp.
httpRules:
  - to:
      operations:
        - paths:
            - prefix: /mcp
target:
  resources:
    - projects/${PROJECT_ID}/locations/${GC_REGION}/agentGateways/${GC_GATEWAY_NAME}
